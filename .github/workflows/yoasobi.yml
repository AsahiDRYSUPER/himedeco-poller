name: yoasobi-watch

# 夜遊びヘブン（外国人向けサイト）の多言語チャットの見張り：未返信を読んで分けて、ntfyで知らせる（送信はまだしない）。
# 2026-10-22 手動で確かめ（店舗IDで入れた・未返信1件を通知）→ 10分ごとの定期に。

on:
  workflow_dispatch:
    inputs:
      shops:
        description: "見る店（shopdirをカンマ区切り。既定は cg_kirakira）"
        type: string
        default: "cg_kirakira"
      send_name:
        description: "1通だけ送る時：相手のスレッド名（会話リストの名前）。空なら見張りだけ"
        type: string
        default: ""
      send_text:
        description: "1通だけ送る時：本文（日本語。夜遊び側が翻訳）"
        type: string
        default: ""
      probe_name:
        description: "スレッドの作りを調べる時：相手のスレッド名（送らない）"
        type: string
        default: ""
  repository_dispatch:
    types: [yoasobi-chat]
  # 定期は collect.yml の見張りの中（collect_loop.py、2回に1回＝10分ごと）で回す。ここは手動と repository_dispatch だけ（cronは当てにならないので外した。2026-10-22）

permissions:
  contents: write

concurrency:
  group: yoasobi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 playwright "anthropic==0.125.0" > /dev/null   # AI（お客さんへの返事）に anthropic が要る 2026-10-23
      - name: ブラウザを用意する（apt のロックが空くのを待ってから入れる。2026-10-23 ロック待ちで固まる・失敗する回があった）
        timeout-minutes: 12
        run: |
          for i in $(seq 1 100); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 5; done
          python3 -m playwright install --with-deps chromium > /dev/null || python3 -m playwright install chromium > /dev/null
      - name: 見張る
        env:
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YOASOBI_SHOPS: ${{ inputs.shops || 'cg_kirakira' }}
          AUTO_YOASOBI: ${{ vars.AUTO_YOASOBI || 'off' }}
          YOASOBI_STATE: yoasobi_state.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REPLY: ${{ vars.AI_REPLY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
        run: bash quiet.sh yoasobi python3 yoasobi_watch.py || true
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "yoasobi-bot"
          git config user.email "actions@github.com"
          git add yoasobi_state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "yoasobi state" && git pull --rebase -q && git push; } || true
