name: board-collect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "連続実行(前の実行が終わるたびに、次を自動で起動する)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: board-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 cryptography playwright "anthropic==0.125.0"
      - name: ブラウザを用意する（出勤の返事をそのまま上げる時に使う。固まる日があるので6分で打ち切ってやり直す 2026-10-23）
        id: pw
        continue-on-error: true
        timeout-minutes: 6
        run: python3 -m playwright install --with-deps chromium
      - if: steps.pw.outcome == 'failure'
        timeout-minutes: 8
        run: python3 -m playwright install --with-deps chromium
      - name: 出勤の返事の読み方が壊れていないか
        run: python3 test_shift_reply.py && python3 test_reply_rules.py && python3 test_shift_apply.py && python3 test_sokuhime_fix.py && python3 test_si9_sort.py
      - name: Collect
        env:
          CITYHEAVEN_API_KEYS: ${{ secrets.CITYHEAVEN_API_KEYS }}
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YOASOBI_SWEEP_CYCLES: ${{ vars.YOASOBI_SWEEP_CYCLES }}   # 夜遊びの見回りの間隔（受け口が動いたら 12）
          AUTO_YOASOBI: ${{ vars.AUTO_YOASOBI }}           # 夜遊び：定型（A）のAIの返事をお客さんにそのまま送るか（on/off。既定 off＝下書きを通知）
          YOASOBI_SHOPS: ${{ vars.YOASOBI_SHOPS }}         # 夜遊びを見る店（空なら cg_kirakira）
          SHIFT_AUTO: ${{ vars.SHIFT_AUTO }}
          AUTO_REPLY: ${{ vars.AUTO_REPLY }}
          NO_AUTO_IDS: ${{ secrets.NO_AUTO_IDS }}
          CAST_MYPAGE_TOKEN: ${{ secrets.CAST_MYPAGE_TOKEN }}
          CASTS_MAP: ${{ secrets.CASTS_MAP }}
          TODO_KEY: ${{ secrets.TODO_KEY }}
          BOOTH_URL: ${{ secrets.BOOTH_URL }}
          CTI_PASSWORD: ${{ secrets.CTI_PASSWORD }}
          CTI_LOGIN_URL: ${{ secrets.CTI_LOGIN_URL }}
          SINCHAKUN_ID: ${{ secrets.SINCHAKUN_ID }}
          SINCHAKUN_PASSWORD: ${{ secrets.SINCHAKUN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REPLY: ${{ vars.AI_REPLY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_EFFORT: ${{ vars.AI_EFFORT }}
          AI_PRIVATE_NOTES: ${{ secrets.AI_PRIVATE_NOTES }}   # 女の子の取り分。公開ログに出ないよう金庫に（2026-10-23）
          GH_TOKEN: ${{ github.token }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.loop) && '55' || '0' }}
        run: python3 collect_loop.py
      - name: Chain next run
        if: always() && (github.event_name == 'schedule' || inputs.loop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" -f loop=true || true
