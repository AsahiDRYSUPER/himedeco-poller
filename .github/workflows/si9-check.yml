name: si9-check

# 新着んの並び替えを、手で1回だけ動かす（既定は「案を作るだけ」。保存も送信もしない）。名前はログに出ない。
on:
  workflow_dispatch:
    inputs:
      shops:
        description: "店（例 cg_kirakira）"
        type: string
        default: "cg_kirakira"
      mode:
        description: "dry＝案を作るだけ（既定）／send＝本当に保存して7サイトへ送る"
        type: string
        default: "dry"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWLEDGE_KEY: ${{ secrets.KNOWLEDGE_KEY }}   # 鍵つきの指示書・定型文・店の設定を開く（2026-10-25）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 cryptography playwright
      - run: python3 -m playwright install --with-deps chromium
      - run: bash quiet.sh si9-test python3 test_si9_sort.py
      - name: 並びの案を作る（mode が send の時だけ保存して送る）
        env:
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          CTI_PASSWORD: ${{ secrets.CTI_PASSWORD }}
          CTI_LOGIN_URL: ${{ secrets.CTI_LOGIN_URL }}
          SINCHAKUN_ID: ${{ secrets.SINCHAKUN_ID }}
          SINCHAKUN_PASSWORD: ${{ secrets.SINCHAKUN_PASSWORD }}
          SI9_SORT_SHOPS: ${{ inputs.shops }}
          SI9_SORT_MODE: ${{ inputs.mode }}
          TODO_KEY: ${{ secrets.TODO_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          bash quiet.sh si9-sort python3 si9_sort.py
          if [ "${{ inputs.mode }}" = "send" ] && [ -f out/si9_status.json ]; then bash publish_data.sh; fi
