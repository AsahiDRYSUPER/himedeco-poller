name: jp-sokuhime

# 日本のIPで動く実行機（self-hosted, jp）で、即ヒメ直しと新着んの並び替えを回す。
# 2026-10-23 GitHubのクラウド（米国）からは CTI が接続拒否・新着んがログインで403になったため、この2つだけ日本側で動かす。
#   1回の実行の中で即ヒメ直しをくり返す（sokuhime_loop.py。間隔は鍵つきの決まり sealed/ops_sokuhime.enc）。
#   新着んは横で1回だけ（間をあける決まりは鍵つき）。実行は約9分で終わり、最後に自分で次の実行を起動する（動く時間のうち。時間帯は鍵つきの決まり）。
# GitHub の定期実行（schedule）はこのアカウントでは4〜5時間に1回しか動かない。Mac の起動係（~/jp-dispatch/dispatch.sh、10分ごと）は鎖が切れた時の予備。下の schedule も予備。

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "見るだけ（即ヒメは --dry、新着んは案を作るだけ。次の実行は起動しない）"
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *"   # 予備。動く時間かどうかは中で鍵つきの決まりを見て決める

permissions:
  contents: write
  actions: write

concurrency:
  group: jp-sokuhime
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, jp]
    timeout-minutes: 20
    env:
      KNOWLEDGE_KEY: ${{ secrets.KNOWLEDGE_KEY }}   # 鍵つきの指示書・定型文・店の設定を開く（2026-10-25）
      LANG: ja_JP.UTF-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 道具がそろっているか
        run: |
          PY="$HOME/jp-venv/bin/python"
          "$PY" -c "import playwright, requests, bs4, cryptography; print('ok')"
      - name: 即ヒメ直し（くり返し）と新着んの並び替え（横で1回）
        env:
          CITYHEAVEN_API_KEYS: ${{ secrets.CITYHEAVEN_API_KEYS }}
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          CTI_PASSWORD: ${{ secrets.CTI_PASSWORD }}
          CTI_LOGIN_URL: ${{ secrets.CTI_LOGIN_URL }}
          SINCHAKUN_ID: ${{ secrets.SINCHAKUN_ID }}
          SINCHAKUN_PASSWORD: ${{ secrets.SINCHAKUN_PASSWORD }}
          TODO_KEY: ${{ secrets.TODO_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAST_MYPAGE_TOKEN: ${{ secrets.CAST_MYPAGE_TOKEN }}   # 夜遊びの配車の連絡を非公開側（cast-mypage）で起動する
          AUTO_YOASOBI: ${{ vars.AUTO_YOASOBI }}                # on の時だけお客さんに送る（off は文を作るだけ）
          CASTS_MAP: ${{ secrets.CASTS_MAP }}
          NO_AUTO_IDS: ${{ secrets.NO_AUTO_IDS }}
          SOKUHIME_DRY: ${{ inputs.dry && '1' || '' }}
          SI9_SORT_MODE: ${{ inputs.dry && 'dry' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PY="$HOME/jp-venv/bin/python"
          mkdir -p out
          QUIET_DIR="$HOME/jp-logs" bash quiet.sh sokuhime "$PY" sokuhime_loop.py
      - name: 記録を公開（data ブランチ）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TODO_KEY: ${{ secrets.TODO_KEY }}   # 切り替え直後に、前の平文の記録を鍵つきへ移す（publish_data.sh → data_box.py）
        run: PY="$HOME/jp-venv/bin/python" bash publish_data.sh
      - name: 次の実行を起動する（動く時間のうち。時間帯は鍵つきの決まり ops_sokuhime の "hours" の "chain"）
        if: always() && !inputs.dry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PY="$HOME/jp-venv/bin/python"
          if "$PY" ops_hours.py within chain; then
            # 実行機（launchd の常駐）の PATH には ~/bin が入っていないので、gh は置き場所を直接書く（2026-10-24 黙って失敗していた）
            "$HOME/bin/gh" workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" && echo "次の実行を起動した" || echo "次の実行を起動できなかった（起動係が10分以内に始める）"
          else
            echo "動く時間の外か、時間帯の決まり（鍵つき）が開けないので次は起動しない（朝は起動係が始める）"
          fi
