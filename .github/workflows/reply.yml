name: review-reply

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "連続実行(前の実行が終わるたびに、次を自動で起動する)"
        type: boolean
        default: false
      dry_run:
        description: "確認のみ（返信を投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: review-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      KNOWLEDGE_KEY: ${{ secrets.KNOWLEDGE_KEY }}   # 鍵つきの指示書・定型文・店の設定を開く（2026-10-25）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 cryptography   # cryptography＝鍵つきの設定を開く（2026-10-25）
      - name: Reply
        env:
          REPLY_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.loop) && 'false' || (inputs.dry_run == false && 'false' || 'true') }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.loop) && '55' || '0' }}
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # 決まり（鍵つき）が開けず自動で返せなかった時だけ知らせる（2026-10-25）
          TODO_KEY: ${{ secrets.TODO_KEY }}       # 状態（件数）は鍵つきの out/reply_status.enc.json に書く（2026-10-26）
        run: |
          mkdir -p out
          bash quiet.sh reply python3 reply_reviews.py
      - name: 状態を公開（data ブランチの reply_status.enc.json。main にはコミットしない）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TODO_KEY: ${{ secrets.TODO_KEY }}
        run: bash publish_data.sh || true
      - name: Chain next run
        if: always() && (github.event_name == 'schedule' || inputs.loop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" -f loop=true || true
