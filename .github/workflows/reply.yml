name: review-reply

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "確認のみ（返信を投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: review-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Reply
        env:
          REPLY_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == false && 'false' || 'true') }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '55' || '0' }}
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
        run: python3 reply_reviews.py
      - name: Save status
        if: always()
        run: |
          git config user.name "reply-bot"
          git config user.email "actions@github.com"
          git add reply_status.json
          git diff --cached --quiet || { git commit -m "status" && git push; } || true
