name: himedeco-poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "連続実行(前の実行が終わるたびに、次を自動で起動する)"
        type: boolean
        default: false
      dry_run:
        description: "確認のみ（自動返信しない）"
        type: boolean
        default: true
      verify_order:
        description: "一覧の並び順の検証（全員分を調べる）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: himedeco-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Poll
        env:
          REPLY_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.loop) && 'false' || (inputs.dry_run == false && 'false' || 'true') }}
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.loop) && '57' || '0' }}
          VERIFY_ORDER: ${{ inputs.verify_order && '1' || '' }}
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
        run: python3 poll.py
      - name: Save status
        if: always()
        run: |
          git config user.name "poll-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --cached --quiet || { git commit -m "status" && git push; } || true
      - name: Chain next run
        if: always() && (github.event_name == 'schedule' || inputs.loop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" -f loop=true || true
