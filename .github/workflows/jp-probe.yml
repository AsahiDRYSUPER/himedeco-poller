name: jp-probe

# 日本の実行機（self-hosted, jp）で、CTIの予約の窓の中身を読むだけの調べ（2026-10-25）。
# 公開リポジトリなので、中身は実行機の中のファイル（~/jp-probe/）にだけ書き、ログには件数だけ出す。手で起動した時だけ動く。

on:
  workflow_dispatch:
    inputs:
      max:
        description: "開く予約の数（既定40）"
        type: string
        default: "40"

permissions:
  contents: read

concurrency:
  # 即ヒメ直しと同じ組にすると、待っている回どうしが取り消し合う（GitHub の決まり）。実行機は1台なので、組が違っても順番に動く
  group: jp-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, jp]
    timeout-minutes: 15
    env:
      PY: /Users/yamazakikazuki/jp-venv/bin/python
      LANG: ja_JP.UTF-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: CTIの予約の窓を読む（読むだけ）
        env:
          CTI_PASSWORD: ${{ secrets.CTI_PASSWORD }}
          CTI_LOGIN_URL: ${{ secrets.CTI_LOGIN_URL }}
          PROBE_MAX: ${{ inputs.max }}
        run: QUIET_DIR=/Users/yamazakikazuki/jp-logs bash quiet.sh jp-probe $PY cti_resv_probe.py
