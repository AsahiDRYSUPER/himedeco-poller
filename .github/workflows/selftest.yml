name: selftest

# 出勤の自動上げの部品が動くかを確かめる（書き込みはしない）。手で起動した時だけ動く。

on:
  workflow_dispatch:
    inputs:
      live_shop:
        description: "即ヒメ直しを本番で1店だけ今すぐ動かす（shopdir。例 torori_angel。空なら見るだけ）"
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 cryptography playwright
      - name: 個室の自動予約（寮管理表）の鍵が通るか（書き込みなし）
        env:
          BOOTH_URL: ${{ secrets.BOOTH_URL }}
        run: python3 booth.py --check
      - name: 出勤申請が読めるか（読むだけ。数だけ出す）
        continue-on-error: true   # 承認待ちが無い週は確かめられず失敗扱いになるが、他の確かめは続ける
        env:
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
        run: python3 shift_apply.py --selftest
      - run: python3 -m playwright install --with-deps chromium
      - name: 返事の読み方
        run: python3 test_shift_reply.py && python3 test_sokuhime_fix.py
      - name: 即ヒメ直し（見るだけ。CTIとヘブンを読んで、直す予定だけ出す）
        env:
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
          CTI_PASSWORD: ${{ secrets.CTI_PASSWORD }}
          CTI_LOGIN_URL: ${{ secrets.CTI_LOGIN_URL }}
          CITYHEAVEN_API_KEYS: ${{ secrets.CITYHEAVEN_API_KEYS }}
          TODO_KEY: ${{ secrets.TODO_KEY }}
        run: |
          if [ -n "${{ inputs.live_shop }}" ]; then python3 sokuhime_fix.py "${{ inputs.live_shop }}"; else python3 sokuhime_fix.py --dry; fi
      - name: ブラウザでログインして出勤登録の画面が開けるか
        env:
          CITYHEAVEN_SHOP_CREDS: ${{ secrets.CITYHEAVEN_SHOP_CREDS }}
        run: python3 shift_auto.py --selftest s_matikado
      - name: 裏姫デコの作成（cast-mypage）を起動できるか（鍵があれば）
        env:
          CAST_MYPAGE_TOKEN: ${{ secrets.CAST_MYPAGE_TOKEN }}
        run: python3 cast_mypage.py --test
